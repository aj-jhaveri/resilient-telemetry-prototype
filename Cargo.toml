[workspace]
resolver = "2"
members = [
    "crates/protocol",
    "crates/sensor-node",
    "crates/link-sim",
    "crates/control-node",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.87"
publish = false

[workspace.dependencies]
protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
